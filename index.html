function safariPage(){if(subPage==='safari-search'){return head('Safari 검색')+`<form class="searchbar" id="safariSearch"><input class="field" name="q" placeholder="검색어 입력" value="썸 기준"><button class="btn">검색</button></form>`+['썸 기준','데이트룩','남자한테 연락 먼저 해도 될까','첫 데이트 추천','상대방이 나를 좋아하는지 아는 법'].map((x,i)=>'<button class="listitem" '+(i===0?'data-crush':'')+'>⌕　'+x+'</button>').join('')}if(subPage==='crush'){return head('검색 결과')+`<div class="card" style="text-align:center;padding:30px 15px"><h3>송은석 ♡ 쇼타로</h3><p>두 사람은 썸일 가능성이 매우 높습니다.</p></div>`}return head('Safari')+`<form class="searchbar" id="safariSearch"><input class="field" name="q" placeholder="검색 또는 웹 사이트 이름" readonly value="검색어를 입력하세요"><button class="btn" type="button" data-search-open>⌕</button></form><div class="news"><h3>[우리 결혼했어요] 달돌커플 시청률 대폭발!</h3><p>첫 방송부터 화제를 모은 달돌커플! 배우 송은석과 RISE 쇼타로의 예상 밖 케미에 시청자들의 관심이 쏟아지고 있다.</p></div><button class="listitem" data-search-open>⌕　검색 기록 보기</button>`}
function naverPage(){if(subPage.startsWith('naver:')){let q=subPage.slice(6);if(q==='라이즈')return head('네이버 검색')+`<div class="card"><h3>RISE (라이즈)</h3><p class="tiny">멤버</p><p>쇼타로 · 성찬 · 원빈 · 소희 · 앤톤</p></div>`;if(q==='우결')return head('네이버 검색')+`<div class="news"><h3>《블랙 쉐도우 사제》 송은석, ‘우리 결혼했어요’ 출연 확정… 상대는 누구?</h3><p>배우 송은석의 새로운 예능 출연 소식이 전해졌다.</p></div>`;if(q==='송은석 열애설')return head('네이버 검색')+`<div class="empty">검색 결과가 없습니다.</div>`;if(q==='송은석 범죄도시락')return head('범죄도시락')+`<div class="card"><h3>《범죄도시락》</h3><p>장르: 범죄 · 액션</p><p>출연: 송은석, 소달호, 원반, 쿨톤, 만찬, 소철</p><p>거대한 비리 기업 뒤에 숨어 있는 범죄조직의 실체를 쫓는 세 형사. 수사 끝에 기업과 조직의 은밀한 연결고리를 발견하고, 각자의 방식으로 사건을 추적하며 위험한 진실에 다가간다.</p><p>송은석 — 욘석</p></div>`;return head('송은석 프로필')+`<div class="card"><h3>송은석</h3><p>배우 · 출연작</p>${[['블랙 쉐도우 사제','송부제','정체를 알 수 없는 사건이 연이어 발생하는 작은 마을.'],['커피라이즈 1호점','송한결','개성 넘치는 직원들이 모인 카페의 이야기.'],['거침있는 하이킥','돌민용','가족과 이웃들의 좌충우돌 일상.'],['런닝라이즈','예능 출연','매주 새로운 장소에서 미션을 수행하는 예능.'],['범죄도시락','욘석','비리 기업 뒤에 숨은 범죄조직을 추적하는 형사들.']].map(x=>`<div class="eventline"><strong>${x[0]}</strong><br><span class="tiny">${x[1]}</span><br>${x[2]}</div>`).join('')}</div>`}return head('네이버')+`<form class="searchbar" id="naverSearch"><input class="field" name="q" placeholder="검색어를 입력하세요"><button class="btn">검색</button></form><div class="news"><h3>RISE, 신곡 무대 공개… 다섯 멤버의 완벽한 호흡에 팬들 열광</h3><p>새로운 무대로 돌아온 RISE가 개성 넘치는 퍼포먼스와 탄탄한 팀워크로 관심을 모았다.</p></div><div class="news"><h3>《우리 결혼했어요》 달돌커플 단독 인터뷰, 첫 방송부터 심상치 않은 케미</h3><p>배우 송은석과 RISE 쇼타로가 가상 부부로 첫선을 보인 가운데, 첫 방송부터 화제를 모은 두 사람의 이야기를 들어봤다.</p></div><div class="card"><strong>최근 검색</strong>${['송은석 열애설','송은석 범죄도시락','송은석','우결','라이즈'].map(q=>`<button class="listitem" data-naver="${q}">⌕　${q}</button>`).join('')}</div>`}
function render(){let main=$('#main');main.classList.toggle('homewall',pageName==='home');let content={home,phone:contactList,sms:smsPage,kakao:kakaoPage,notes:notesPage,calendar:calendarPage,photos:photosPage,music:musicPage,twitter:twitterPage,instagram:instagramPage,safari:safariPage,naver:naverPage}[pageName]||home;main.innerHTML=content();main.scrollTop=0;}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.pin){let v=b.dataset.pin;if(v==='clear')enteredPin='';else if(v==='back')enteredPin=enteredPin.slice(0,-1);else if(enteredPin.length<4)enteredPin+=v;document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<enteredPin.length));if(enteredPin.length===4){if(enteredPin==='0319')$('#lockScreen').style.display='none';else{enteredPin='';$('#pinError').textContent='암호가 올바르지 않습니다';document.querySelectorAll('.dot').forEach(d=>d.classList.remove('on'))}}return}if(b.dataset.app){go(b.dataset.app);return}if(b.hasAttribute('data-back')){if(pageName==='home')return;if(subPage){subPage='';render()}else go('home');return}if(b.dataset.sub){subPage=b.dataset.sub;render();return}if(b.dataset.sms!==undefined){subPage='sms:'+b.dataset.sms;go('sms',subPage);return}if(b.dataset.kakao){subPage='kakao:'+b.dataset.kakao;go('kakao',subPage);return}if(b.dataset.month){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+Number(b.dataset.month),1);render();return}if(b.dataset.date){selectedDate=b.dataset.date;render();return}if(b.dataset.photo!==undefined){$('#modal').innerHTML=`<div class="modal"><button data-close-modal>×</button><img src="${photoItems[+b.dataset.photo]}"></div>`;return}if(b.hasAttribute('data-close-modal')){$('#modal').innerHTML='';return}if(b.dataset.ig){igAccount=b.dataset.ig;render();return}if(b.hasAttribute('data-search-open')){subPage='safari-search';render();return}if(b.hasAttribute('data-crush')){subPage='crush';render();return}if(b.dataset.naver){subPage='naver:'+b.dataset.naver;render();return}if(b.hasAttribute('data-save-note')){toast('메모를 수정했어');return}if(b.hasAttribute('data-add-note')){$('#extraNotes').innerHTML+='<div class="noteitem"><input class="field" placeholder="제목"><textarea class="field" placeholder="내용" style="margin-top:8px"></textarea></div>';return}if(b.hasAttribute('data-delete-note')){$('#todoText').value='';$('#extraNotes').innerHTML='';toast('메모를 비웠어');return}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);if(f.id==='naverSearch'){let q=String(d.get('q')).trim();if(q){subPage='naver:'+q;render()}}if(f.id==='safariSearch'){let q=String(d.get('q')).trim();if(q==='썸 기준'){subPage='crush';render()}else{subPage='safari-search';render()}}if(f.id==='visitorForm'){let q=String(d.get('visitor')).trim(),r='무슨 얘기야?';if(q.includes('뭐 해'))r='나 그냥 집이야';else if(q.includes('보고 싶'))r='나도 보고 싶어';else if(q.includes('좋아해'))r='ㅋㅋ 갑자기?';else if(q.includes('뭐 먹'))r='아부라소바 먹었어';else if(q.includes('잘 자')||q.includes('잘자'))r='형도 잘 자';let el=$('#visitorLog');el.innerHTML+=`<div class="bubble mine">${esc(q)}</div><div class="bubble">${esc(r)}</div>`;f.reset()}});
document.addEventListener('change',e=>{if(e.target.id==='photoInput'){for(let file of e.target.files){if(!file.type.startsWith('image/'))continue;let r=new FileReader();r.onload=()=>{photoItems.push(r.result);render()};r.readAsDataURL(file)}}});function tick(){let d=new Date();$('#clock').textContent=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});$('#lockTime').textContent=$('#clock').textContent;$('#lockDate').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}tick();setInterval(tick,1000);render();
</script></body></html>
