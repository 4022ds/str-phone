  position:absolute!important; inset:-1px!important; box-sizing:border-box!important;
  width:auto!important; height:auto!important; margin:0!important;
  border-radius:inherit!important; background:#000!important; overflow:hidden!important;
}
#screen > #lockScreen.pin-mode {
  inset:-1px!important; padding:0!important; border-radius:inherit!important;
  box-sizing:border-box!important; background:#000!important;
}
#screen > #lockScreen.pin-mode > .pin {
  display:flex!important; position:absolute!important; inset:0!important;
  box-sizing:border-box!important; width:auto!important; height:auto!important;
  margin:0!important; border:0!important; border-radius:inherit!important;
  padding:clamp(72px,13vh,100px) 28px 28px!important;

}

function safariPage(){if(subPage.startsWith('safari-result:')){let q=subPage.slice(14);return `<div class="pagehead"><button class="back" data-back>‹</button><h2>검색 결과</h2></div><div class="article-page"><h1>${esc(q)}</h1>${q==='썸 기준'?'<div class="card" style="text-align:center"><h3>송은석 ♡ 쇼타로</h3><p>두 사람은 썸일 가능성이 매우 높습니다.</p></div>':'<p>검색 결과를 찾았습니다.</p><p>관련된 내용을 더 확인해 보세요.</p>'}</div>`}return `<div class="pagehead"><h2>Safari</h2><span style="margin-left:auto;color:#1683ff">···</span></div><form class="searchbar" id="safariSearch"><input class="field" id="safariSearchInput" name="q" placeholder="검색 또는 웹 사이트 이름" autocomplete="off"><button class="btn">검색</button></form><div id="safariHistory" class="history-panel show"><div class="history-title">최근 검색</div><button class="listitem" data-safari-history="썸 기준">⌕　썸 기준</button><div class="listitem" aria-disabled="true" style="cursor:default;opacity:.85">⌕　내가 좋아하는 사람이 날 좋아하는지 아는 법</div></div><div class="news safari-news"><h3>우리 결혼했어요 송은석 🩷 쇼타로 시청률 대폭발</h3><p>첫 방송부터 화제를 모은 달돌커플! 배우 송은석과 RISE 쇼타로의 예상 밖 케미에 시청자들의 관심이 쏟아지고 있다.</p></div><div class="news safari-news"><h3>《우리 결혼했어요》 달돌커플 단독 인터뷰, 첫 방송부터 심상치 않은 케미</h3><p>첫 방송 이후 직접 들어 본 두 사람의 촬영 비하인드와 서로에 대한 첫인상.</p></div>`}
function naverPage(){if(subPage.startsWith('article:')){let type=subPage.slice(8);let interview=type==='interview';return `<div class="pagehead"><button class="back" data-back>‹</button><h2>뉴스</h2><span style="margin-left:auto;color:#03c75a;font-weight:900">N</span></div><article class="article-page"><div class="tiny">연예 · 단독</div><h1>${interview?'[단독 인터뷰] 《우리 결혼했어요》 달돌커플, 첫 만남부터 번지점프까지… 두 사람의 첫 촬영은?':'우리 결혼했어요 송은석 🩷 쇼타로 시청률 대폭발'}</h1><div class="article-sub">스타뉴스　2026.10.${interview?'11':'10'}　기사 읽기</div>${interview?`<p>첫 방송부터 예상 밖의 케미로 시청자들의 관심을 모은 배우 송은석과 RISE 쇼타로. 서로 다른 분야에서 활동해 온 두 사람이 가상 부부로 만나 첫 데이트부터 번지점프에 도전했다. 첫 만남은 어땠을까? 두 사람에게 직접 물어봤다.</p><h3>Q1. 시청자분들께 간단한 자기소개 부탁드립니다.</h3><p><strong>송은석:</strong> 안녕하세요, 배우 송은석입니다.</p><p><strong>쇼타로:</strong> 안녕하세요, RISE 쇼타로입니다!</p><h3>Q2. 서로의 첫인상은 어땠나요?</h3><p><strong>송은석:</strong> 일단 귀엽게 생겼다고 생각했어요. 웃는 것도 그렇고 표정이 되게 귀여워서 호감이 갔어요. 제가 평소에 귀여운 사람을 좋아하기도 하고요. 생각해 보니까 제 이상형이랑 꽤 비슷한 것 같더라고요. (웃음)</p><p><strong>쇼타로:</strong> 저는 처음에 선배님 얼굴을 제대로 못 봤어요. 너무 잘생기셔서 눈을 마주치기가 조금 어려웠어요. 화면으로 볼 때도 잘생겼다고 생각했는데 실제로 보니까 더 잘생기셔서…… 처음에는 어떻게 말을 해야 할지도 모르겠더라고요. (웃음)</p><h3>Q3. 첫 촬영은 어땠나요?</h3><p><strong>송은석:</strong> 상대가 누군지 전혀 예상하지 못했어요. 그리고 첫 데이트부터 번지점프를 하게 될 줄은 정말 몰랐어요. 처음에는 조금 당황했는데, 막상 해 보니까 너무 재미있었어요. 오히려 그런 예상 밖의 상황 덕분에 어색함도 빨리 풀린 것 같아요.</p><p><strong>쇼타로:</strong> 저는 이런 예능 촬영이 처음이라 처음에는 조금 긴장했어요. 그런데 은석 선배님이 먼저 편하게 대해 주시고 잘 이끌어 주셔서 생각보다 빨리 적응할 수 있었어요. 번지점프도 처음에는 무서웠는데 같이 하니까 재미있었고요. 첫 촬영이 좋은 기억으로 남을 것 같아요.</p><h3>Q4. 평소 이상형은 어떤 사람인가요?</h3><p><strong>송은석:</strong> 아까 말씀드렸듯이 쇼타로 씨처럼 얼굴도 성격도 귀여운 사람이 좋아요. 같이 있을 때 편하고, 웃는 모습이 예쁜 사람이요. 꼭 뭔가 대단한 걸 하지 않아도 같이 시간을 보내는 것만으로 즐거운 사람이면 좋겠어요.</p><p><strong>쇼타로:</strong> 그렇게 말씀해 주셔서 감사합니다. (웃음) 저는 키가 조금 크고, 강동원 선배님을 살짝 닮은 사람이요. 그리고 남자의 마음을 이해해 주는 사람이면 좋겠어요. 경제적으로도 여유가 있으면 좋겠고요. 꼭 엄청나게 큰 이벤트를 해 주는 것보다는 가끔 장미꽃 한 송이를 건네주는 사람? 그런 작은 걸 기억해 주는 사람이 좋아요.</p><h3>Q5. 상대방이 가상 배우자로 정해졌다는 소식을 들었을 때 기분이 어땠나요?</h3><p><strong>송은석:</strong> 처음에는 정말 놀랐어요. 제가 생각했던 사람도 아니었고, 쇼타로 씨와 함께 부부로 촬영한다는 게 신기했어요. 아이돌이라는 것도 알고 있었고 평소에 밝은 이미지라고 생각했는데, 실제로 만나면 어떨지 궁금했거든요. 그런데 막상 만나 보니까 생각했던 것보다 훨씬 귀엽고 편한 사람이더라고요. 첫 촬영을 하고 나서는 앞으로 같이 촬영하면 재미있겠다는 생각이 들었어요.</p><p><strong>쇼타로:</strong> 저도 정말 놀랐어요. 상대가 누구일지 계속 궁금했는데 은석 선배님이라는 말을 듣고 순간 머릿속이 복잡해졌어요. 너무 잘생기신 분이라 제가 잘할 수 있을까 걱정도 했고요. (웃음) 그래도 촬영하면서 먼저 편하게 대해 주셔서 감사했어요. 처음에는 긴장했지만, 앞으로 선배님과 더 많은 시간을 보내면 서로에 대해 더 잘 알게 되지 않을까 기대하고 있어요.</p><h3>Q6. 앞으로 함께 촬영하면서 해 보고 싶은 것이 있나요?</h3><p><strong>송은석:</strong> 일단 쇼타로 씨가 하고 싶은 걸 많이 해 보고 싶어요. 첫 촬영 때 번지점프도 했으니까 다음에는 조금 편안한 데이트도 해 보고 싶고요. 맛있는 것도 먹고, 같이 산책도 하고, 평범한 하루를 보내는 것도 좋을 것 같아요. 앞으로 서로 더 편해지면서 재미있는 모습을 많이 보여드리고 싶습니다.</p><p><strong>쇼타로:</strong> 저도 선배님과 다양한 걸 해 보고 싶어요. 아직 서로 모르는 부분이 많으니까 같이 시간을 보내면서 조금씩 알아가면 좋겠어요. 앞으로는 제가 먼저 이것저것 제안도 해 보고 싶고요. 저희 둘이 어떤 모습을 보여드릴지 저도 기대돼요.</p><h3>Q7. 달돌커플을 응원해 주시는 팬분들께 한마디 부탁드립니다.</h3><p><strong>송은석:</strong> 첫 방송 재미있게 봐주셨나요? 저도 촬영하면서 쇼타로 씨의 새로운 모습을 많이 발견하고 있어요. 앞으로 함께하는 시간이 더 많아질 텐데, 저희가 조금씩 가까워지는 모습도 재미있게 지켜봐 주셨으면 좋겠습니다. 열심히 촬영하겠습니다. 감사합니다!</p><p><strong>쇼타로:</strong> 저희 첫 방송을 봐주시고 응원해 주셔서 정말 감사합니다! 처음이라 조금 어색한 모습도 있었을 텐데 예쁘게 봐주셔서 감사해요. 앞으로 은석 선배님과 좋은 추억도 많이 만들고, 재미있는 모습도 많이 보여드리고 싶어요. 달돌커플 많이 응원해 주세요!</p>`:`<p><strong>배우 송은석과 쇼타로가 가상 부부로 첫선을 보인 《우리 결혼했어요》가 첫 방송부터 뜨거운 반응을 얻었다.</strong></p><p>지난 10일 공개된 첫 방송에서는 두 사람이 처음 만나 어색하게 인사를 나누는 모습부터 함께 미션에 도전하며 가까워지는 과정까지 담겼다. 예상보다 솔직한 쇼타로의 반응과 차분하게 대화를 이끄는 송은석의 모습이 어우러지며 색다른 케미를 만들었다.</p><h3>첫 만남부터 시청자 관심 집중</h3><p>두 사람은 처음에는 조심스럽게 말을 골랐지만, 함께 시간을 보내면서 자연스럽게 웃음이 늘어났다. 특히 예상치 못한 미션 앞에서 서로를 챙기고 장난을 주고받는 장면이 방송 직후 화제를 모았다.</p><p>시청자들은 “둘이 어색해하는 모습부터 재밌다”, “성격이 다른데도 묘하게 잘 어울린다”, “다음 방송이 기다려진다”는 반응을 보였다.</p><h3>앞으로의 이야기는?</h3><p>《우리 결혼했어요》는 실제 연인이 아닌 두 출연자가 함께 생활하고 데이트하며 서로를 알아가는 과정을 담는 프로그램이다. 첫 회에서는 아직 서먹한 두 사람의 모습이 주로 그려졌지만, 앞으로 관계가 어떻게 변할지 기대를 모으고 있다.</p><p>송은석과 쇼타로가 만들어 갈 달돌커플의 이야기는 매주 토요일 방송에서 확인할 수 있다.</p>`}</article>`}if(subPage.startsWith('naver:')){let q=subPage.slice(6);if(q==='라이즈')return `<div class="pagehead"><button class="back" data-back>‹</button><h2>검색 결과</h2></div><div class="card"><h3>RISE (라이즈)</h3><p class="tiny">멤버</p const IMAGE_DB_NAME='shotaroPhoneImageDB', IMAGE_DB_STORE='imageRecords';
function openImageDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB를 사용할 수 없습니다'));return;}const req=indexedDB.open(IMAGE_DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(IMAGE_DB_STORE))db.createObjectStore(IMAGE_DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('DB 열기 실패'))})}
async function getImageRecord(key){try{const db=await openImageDB();return await new Promise((resolve,reject)=>{const tx=db.transaction(IMAGE_DB_STORE,'readonly'),req=tx.objectStore(IMAGE_DB_STORE).get(key);req.onsuccess=()=>resolve(req.result??null);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}catch(e){return null}}
async function saveImageRecord(key,value){const db=await openImageDB();return new Promise((resolve,reject)=>{const tx=db.transaction(IMAGE_DB_STORE,'readwrite');tx.objectStore(IMAGE_DB_STORE).put(value,key);tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{db.close();reject(tx.error||new Error('저장 실패'))};tx.onabort=()=>{db.close();reject(tx.error||new Error('저장 취소'))}})}
async function deleteImageRecord(key){const db=await openImageDB();return new Promise((resolve,reject)=>{const tx=db.transaction(IMAGE_DB_STORE,'readwrite');tx.objectStore(IMAGE_DB_STORE).delete(key);tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{db.close();reject(tx.error||new Error('삭제 실패'))};tx.onabort=()=>{db.close();reject(tx.error||new Error('삭제 취소'))}})}

function showStory(idx){
 const stories=[['내 스토리','＋'],['성찬','성'],['원빈','원'],['소희','소'],['앤톤','앤'],['은석','은']];

  ? `<img src="${igStoryPhotos[i]}" style="display:block;max-width:100%;max-height:78%;width:auto;height:auto;object-fit:contain;border-radius:18px" alt="${st[0]} 스토리">`

 if(b.dataset.photo!==undefined){let idx=+b.dataset.photo;$('#modal').innerHTML=`<div class="modal photo-viewer"><button data-close-modal aria-label="닫기">×</button><button class="photo-prev" data-photo-prev="${idx}" aria-label="이전 사진" ${idx===0?'disabled':''}>‹</button><img src="${photoItems[idx]}" alt="사진 ${idx+1}"><button class="photo-next" data-photo-next="${idx}" aria-label="다음 사진" ${idx===photoItems.length-1?'disabled':''}>›</button></div>`;return;}
 if(b.dataset.photoPrev!==undefined){let idx=+b.dataset.photoPrev;if(idx>0){idx--;$('#modal').innerHTML=`<div class="modal photo-viewer"><button data-close-modal aria-label="닫기">×</button><button class="photo-prev" data-photo-prev="${idx}" aria-label="이전 사진" ${idx===0?'disabled':''}>‹</button><img src="${photoItems[idx]}" alt="사진 ${idx+1}"><button class="photo-next" data-photo-next="${idx}" aria-label="다음 사진" ${idx===photoItems.length-1?'disabled':''}>›</button></div>`;}return;}
 if(b.dataset.photoNext!==undefined){let idx=+b.dataset.photoNext;if(idx<photoItems.length-1){idx++;$('#modal').innerHTML=`<div class="modal photo-viewer"><button data-close-modal aria-label="닫기">×</button><button class="photo-prev" data-photo-prev="${idx}" aria-label="이전 사진" ${idx===0?'disabled':''}>‹</button><img src="${photoItems[idx]}" alt="사진 ${idx+1}"><button class="photo-next" data-photo-next="${idx}" aria-label="다음 사진" ${idx===photoItems.length-1?'disabled':''}>›</button></div>`;}return;}

document.addEventListener('input',e=>{if(e.target.id==='noteTitle'||e.target.id==='noteBody'){let id=Number(e.target.dataset.noteId),n=notes.find(x=>x.id===id);if(n){if(e.target.id==='noteTitle')n.title=e.target.value;else n.text=e.target.value}}if(e.target.id==='noteSearch'){let q=e.target.value.toLowerCase();document.querySelectorAll('.nt-row').forEach(el=>el.style.display=el.innerText.toLowerCase().includes(q)?'block':'none')}});
document.addEventListener('change',e=>{if(e.target.matches('[data-wallpaper-input]')){const input=e.target,file=input.files&&input.files[0];if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);wallPhoto=canvas.toDataURL('image/jpeg',0.78);try{localStorage.setItem('shotaroPhoneWallpaper',wallPhoto)}catch(err){toast('사진이 너무 커서 저장하지 못했어. 더 작은 사진을 골라 줘.');return}render();toast('배경화면 사진을 저장했어!')};img.onerror=()=>toast('이 사진은 열 수 없어. 다른 사진을 골라 줘.');img.src=reader.result};reader.readAsDataURL(file);input.value='';return;}if(e.target.matches('[data-selfie-input],[data-ig-story-photo],[data-ig-photo],[data-chat-photo-input],#photoInput')){e.preventDefault();e.target.value='';return;}if(e.target.matches('[data-twitter-photo]')){const input=e.target,file=input.files&&input.files[0],key=input.dataset.twitterPhoto,slot=Number(input.dataset.twitterSlot);if(!file||!file.type.startsWith('image/')||!['archive','bot'].includes(key)||!Number.isInteger(slot)||slot<0||slot>1)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);twitterPhotos[key]=[canvas.toDataURL('image/jpeg',0.76),''];try{localStorage.setItem('shotaroPhoneTwitterPhotos',JSON.stringify(twitterPhotos));render();toast('트윗 사진을 저장했어!')}catch(err){render();toast('저장 공간이 부족해. 더 작은 사진을 골라 줘.')}};img.onerror=()=>toast('이 사진은 열 수 없어. 다른 사진을 골라 줘.');img.src=reader.result};reader.readAsDataURL(file);input.value='';return}if(e.target.matches('[data-selfie-input]')){const file=e.target.files&&e.target.files[0],key=e.target.dataset.selfieInput;if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=async()=>{const scale=Math.min(1,700/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);kakaoSelfies[key]=canvas.toDataURL('image/jpeg',0.72);try{localStorage.setItem('shotaroPhoneKakaoSelfies',JSON.stringify(kakaoSelfies))}catch(err){}try{await saveImageRecord('shotaroPhoneKakaoSelfies',JSON.stringify(kakaoSelfies));render();toast('셀카 사진을 첨부했어!')}catch(err){render();toast('사진은 표시됐지만 저장에 실패했어. 다시 시도해 줘.')} };img.onerror=()=>toast('이 사진은 열 수 없어. 다른 사진을 골라 줘.');img.src=reader.result};reader.readAsDataURL(file);e.target.value='';return}if(e.target.matches('[data-ig-story-photo]')||e.target.matches('[data-ig-photo]')||e.target.matches('[data-chat-photo-input]')){const input=e.target,file=input.files&&input.files[0];if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=async()=>{const scale=Math.min(1,900/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',0.78);try{if(input.matches('[data-ig-story-photo]')){igStoryPhotos[input.dataset.igStoryPhoto]=data;try{localStorage.setItem('shotaroPhoneStoryPhotos',JSON.stringify(igStoryPhotos))}catch(e){}await saveImageRecord('shotaroPhoneStoryPhotos',JSON.stringify(igStoryPhotos));showStory(Number(input.dataset.igStoryPhoto));}else if(input.matches('[data-ig-photo]')){igPostPhotos[input.dataset.igPhoto]=data;try{localStorage.setItem('shotaroPhonePostPhotos',JSON.stringify(igPostPhotos))}catch(e){}await saveImageRecord('shotaroPhonePostPhotos',JSON.stringify(igPostPhotos));render();}else{const key=input.dataset.chatPhotoInput;kakaoChatPhotos[key]=data;try{localStorage.setItem('shotaroPhoneChatPhotos',JSON.stringify(kakaoChatPhotos))}catch(e){}await saveImageRecord('shotaroPhoneChatPhotos',JSON.stringify(kakaoChatPhotos));render();}toast('사진을 추가했어!')}catch(err){toast('저장 공간이 부족할 수 있어. 더 작은 사진을 골라 줘.')}};img.onerror=()=>toast('이 사진은 열 수 없어. 다른 사진을 골라 줘.');img.src=reader.result};reader.readAsDataURL(file);input.value='';return}if(e.target.id==='photoInput'){const files=Array.from(e.target.files||[]).filter(file=>file.type.startsWith('image/'));if(!files.length)return;let pending=files.length;files.forEach(file=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=async()=>{const scale=Math.min(1,800/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);photoItems.push(canvas.toDataURL('image/jpeg',0.70));pending--;if(pending===0){try{try{localStorage.setItem('shotaroPhonePhotoAlbum',JSON.stringify(photoItems))}catch(e){}await saveImageRecord('shotaroPhonePhotoAlbum',JSON.stringify(photoItems));render();toast('사진을 저장했어!')}catch(err){render();toast('사진은 표시됐지만 저장에 실패했어. 다시 시도해 줘.')} }};img.onerror=()=>{pending--;if(pending===0)render()};img.src=r.result};r.onerror=()=>{pending--;if(pending===0)render()};r.readAsDataURL(file)});e.target.value='';return}});
